services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transport}
      POSTGRES_USER: ${POSTGRES_USER:-transport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport_local_only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/opt/transport/db:ro
      - ./db/scripts/init.sh:/docker-entrypoint-initdb.d/000_transport_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CATALOG_BACKEND: postgres
      PREDICTOR_FACTORY: ${PREDICTOR_FACTORY:-app.predictors.mock:build_predictor}
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-transport}
      POSTGRES_USER: ${POSTGRES_USER:-transport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport_local_only}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-3000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      schedule-import:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build:
      context: ./frontend
      args:
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
  schedule-import:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-transport}
      POSTGRES_USER: ${POSTGRES_USER:-transport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transport_local_only}
    volumes:
      - ./db:/project/db:ro
      - ./mock_data:/project/mock_data:ro
    command: ["python", "/project/db/scripts/import_schedule.py", "--if-empty"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
